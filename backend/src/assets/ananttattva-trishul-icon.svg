<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Anant Tattva Trishul + Separator (new logo)">
  <defs>
    <linearGradient id="atOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ff9a3c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e8620c"/>
    </linearGradient>
  </defs>

  <!-- Sharp spear tip (pointed triangle left, matches new brand logo shape) -->
  <polygon points="8,106 132,58 132,162" fill="url(#atOrange)"/>

  <!-- Trishul open "3" shape: outer open C-curves top + bottom joined right, matching provided logo -->
  <path d="M132 34
           C 172 16, 234 22, 264 60
           C 284 84, 276 102, 258 110
           C 276 118, 284 136, 264 160
           C 234 198, 172 204, 132 186"
        fill="none" stroke="url(#atOrange)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Two connector bead circles between curve center and vertical bar -->
  <circle cx="280" cy="98"  r="10" fill="url(#atOrange)"/>
  <circle cx="322" cy="98"  r="17" fill="url(#atOrange)"/>

  <!-- Thick vertical separator bar | (matches new logo proportions) -->
  <rect x="366" y="30" width="22" height="162" rx="8" fill="url(#atOrange)"/>
</svg>
