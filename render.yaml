services:
  - type: web
    name: peoplepulse-hr-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URLS
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: MANUAL_ATTENDANCE_REVIEW_THRESHOLD
        value: "3"
      - key: MANUAL_ATTENDANCE_FACE_RETRY_LIMIT
        value: "2"
      - key: MANUAL_ATTENDANCE_ALLOW_LOCATION_EXCEPTION
        value: "true"
