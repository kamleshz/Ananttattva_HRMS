services:
  - type: web
    name: ananttattva-hrms
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: ML_INTERNAL_PORT
        value: "7001"
      - key: BIOMETRIC_SERVICE_URL
        value: http://127.0.0.1:7001
      - key: FACE_CHALLENGE_EXPIRY_SECONDS
        value: 120
      - key: REDIS_URL
        value: redis://127.0.0.1:6379/0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: FACE_EMBEDDING_KEY
        sync: false
      - key: BIOMETRIC_SERVICE_KEY
        sync: false
      - key: BIOMETRIC_SERVICE_TIMEOUT_MS
        value: "15000"
      - key: CLIENT_URLS
        sync: false
      - key: SEED_ADMIN_ENABLED
        value: "false"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: FACE_ENGINE
        value: opencv_sface
      - key: FACE_DETECTOR
        value: yunet
      - key: FACE_RECOGNIZER
        value: sface
      - key: FACE_ANTI_SPOOF_ENABLED
        value: "true"
      - key: MANUAL_ATTENDANCE_REVIEW_THRESHOLD
        value: "3"
      - key: MANUAL_ATTENDANCE_FACE_RETRY_LIMIT
        value: "2"
      - key: MANUAL_ATTENDANCE_ALLOW_LOCATION_EXCEPTION
        value: "true"
