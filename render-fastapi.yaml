services:
  - type: web
    name: at-connect-fastapi
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: peoplepulse_hr
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CLIENT_URLS
        sync: false
      - key: SEED_ADMIN_ENABLED
        value: "false"
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MAIL_SENDER_EMAIL
        sync: false
      - key: FACE_ENGINE
        value: opencv_sface
      - key: FACE_DETECTOR
        value: yunet
      - key: FACE_RECOGNIZER
        value: sface
      - key: FACE_MODEL_VERSION
        value: opencv-yunet-2023mar-sface-2021dec-minifasnetv2-v1
      - key: FACE_EMBEDDING_KEY
        sync: false
      - key: BIOMETRIC_SERVICE_KEY
        sync: false
      - key: FACE_ANTI_SPOOF_ENABLED
        value: "true"
      - key: FACE_MATCH_THRESHOLD
        value: "0.363"
      - key: FACE_LOW_CONFIDENCE_MARGIN
        value: "0.04"
      - key: FACE_ANTI_SPOOF_THRESHOLD
        value: "0.80"
      - key: FACE_ENROLLMENT_CHALLENGE_EXPIRY_SECONDS
        value: "300"
      - key: MANUAL_ATTENDANCE_REVIEW_THRESHOLD
        value: "3"
      - key: MANUAL_ATTENDANCE_FACE_RETRY_LIMIT
        value: "2"
      - key: MANUAL_ATTENDANCE_ALLOW_LOCATION_EXCEPTION
        value: "true"
