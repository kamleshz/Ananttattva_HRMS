<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-label="Anant Tattva">
  <defs>
    <linearGradient id="atOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ff9a3c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e8620c"/>
    </linearGradient>
  </defs>

  <!-- Sharp spear tip (pointed triangle left, sharp point ~20% from top) -->
  <polygon points="8,106 130,58 130,162" fill="url(#atOrange)"/>

  <!-- Trishul open "3" shape: outer curves top + bottom joined right, inner small loop like logo -->
  <path d="M130 34
           C 170 16, 232 22, 262 60
           C 282 84, 274 102, 256 110
           C 274 118, 282 136, 262 160
           C 232 198, 170 204, 130 186"
        fill="none" stroke="url(#atOrange)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Two connector bead circles between curve and vertical bar -->
  <circle cx="278" cy="98"  r="10"  fill="url(#atOrange)"/>
  <circle cx="320" cy="98"  r="17" fill="url(#atOrange)"/>

  <!-- Thick vertical separator bar | (aligned to right of beads, inline with text baseline) -->
  <rect x="364" y="30" width="22" height="162" rx="8" fill="url(#atOrange)"/>

  <!-- BRAND WORDS — SAME LINE (user's layout: ANANT large orange inline + TATTVA smaller black below-right inline, aligned together) -->
  <text x="420" y="128" fill="url(#atOrange)"
        font-family="Arial, Helvetica, 'Segoe UI', Roboto, system-ui, sans-serif"
        font-size="150" font-weight="500" letter-spacing="6">ANANT</text>
  <text x="822" y="190" fill="#111827"
        font-family="Arial, Helvetica, 'Segoe UI', Roboto, system-ui, sans-serif"
        font-size="92"  font-weight="700" letter-spacing="16">TATTVA</text>
</svg>
